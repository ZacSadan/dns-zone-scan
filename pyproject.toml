[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dns-zone-scan"
dynamic = ["version"]
description = "Enrich DNS zone file records with live data and produce Markdown / HTML reports."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dnspython>=2.6",
    "ipwhois>=1.3",
    "requests>=2.31",
    "cryptography>=42",
    "python-whois>=0.9",
    "markdown>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dns-zone-scan = "dns_zone_scan.__main__:main"

[tool.setuptools]
packages = ["dns_zone_scan"]

[tool.setuptools.dynamic]
version = { attr = "dns_zone_scan.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
